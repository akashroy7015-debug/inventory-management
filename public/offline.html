<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a14">
<title>Offline · StockHub</title>
<!-- Self-contained on purpose: the service worker shows this when the network is down, so it can't rely on other files. -->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f6f8f5; color: #101a14; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #1f6b3a; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  p { margin: 8px 0 0; color: #4a5750; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: #1f6b3a; color: #fff; font-weight: 600; font-size: 17px; text-decoration: none; }
  a:hover { background: #14502a; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
  </div>
  <div>
    <h1>You’re offline</h1>
    <p>Stock counts and orders need a connection so every channel stays in sync. Check your internet and try again.</p>
  </div>
  <a href="/app">Try again</a>
</main>
</body>
</html>
